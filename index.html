<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Score de viralidad en X</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fafafa;--fg:#111;--mu:#5b5b66;--card:#fff;--ln:#e3e3e8;--ac:#1d6bf3;--ok:#0a7d38;--fs:clamp(1.0625rem,1rem + .35vw,1.1875rem)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d10;--fg:#ececf1;--mu:#a0a0ad;--card:#17171c;--ln:#2a2a33;--ac:#6ea2ff;--ok:#4ade80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-wrap:anywhere}
main{max-width:72rem;margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(2rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
h1{font-size:clamp(1.4rem,1.1rem + 1.6vw,2.2rem);line-height:1.2;margin:.5rem 0}
h2{font-size:clamp(1.15rem,1rem + .8vw,1.5rem);margin:2rem 0 .75rem}
p{margin:.5rem 0}
.mu{color:var(--mu);font-size:max(.95em,15px)}
a{color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.75rem}
.st,.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:1rem}
.st b{display:block;font-size:clamp(1.4rem,1.2rem + 1vw,2rem);line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:.75rem}
.card{display:flex;flex-direction:column;gap:.5rem}
.card .h{display:flex;justify-content:space-between;gap:.5rem;font-weight:600}
.txt{white-space:pre-line}
blockquote{margin:0;padding:.75rem;border-left:4px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:0;margin:0;list-style:none}
.chips li{border:1px solid var(--ln);border-radius:999px;padding:.35rem .8rem;background:var(--card)}
ul.l{padding-left:1.2rem;margin:.25rem 0}ul.l li{margin:.35rem 0}
.btn,.card a.v{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:.5rem 1rem;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ac);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.up{color:var(--ok)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;margin:-1px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#more{width:100%;margin-top:1rem}
</style>
</head>
<body>
<main>
<p class="mu" id="who">Cargando…</p>
<h1 id="t">Score de viralidad en X</h1>
<p class="mu" id="upd"></p>
<p class="mu"><a href="./clasico/">Ver tablero completo (ranking, gráficas y tendencias) →</a></p>
<p class="sr" aria-live="polite" id="live"></p>
<div id="app"><noscript>Activa JavaScript para ver el tablero.</noscript></div>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)},app=$('#app');
function e(s){return String(s==null?'':s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n(x){return(+x||0).toLocaleString('es-MX')}
function cmp(x){x=+x||0;return x>=999500?(x/1e6).toFixed(1)+' M':x>=1e3?Math.round(x/1e3)+' mil':String(x)}
function fmt(iso){var m=/^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/.exec(iso||'');if(!m)return iso||'';var mes=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return +m[3]+' '+mes[+m[2]-1]+' '+m[1]+', '+m[4]+':'+m[5]}
function card(h,draft){var s='<article class="card"><div class="h"><span>'+e(h.handle)+'</span><span>'+cmp(h.views)+' vistas</span></div>';
if(draft){s+='<blockquote>'+e(h.draft_en)+'</blockquote>';if(h.video_tip)s+='<p class="mu">🎬 '+e(h.video_tip)+'</p>';if(h.draft_keywords&&h.draft_keywords.length)s+='<p class="mu">Palabras clave: '+e(h.draft_keywords.join(', '))+'</p>';var src=String(h.text||'');s+='<p class="mu">Inspirado en: '+e(src.length>160?src.slice(0,160)+'…':src)+'</p>';s+='<button class="btn" data-c="'+e(h.draft_en)+'">Copiar borrador</button>'}
else s+='<p class="txt">'+e(h.text)+'</p><p class="mu">'+e(h.created_local)+'</p>';
return s+'<a class="v" href="'+e(h.url||h.status_url)+'" target="_blank" rel="noopener">Ver en X</a></article>'}
var PAGE=20;
function render(d){
var hits=(d.hits||[]).slice().sort(function(a,b){return b.views-a.views}),pv=d.previous_day||{},nocmp=pv.comparable===false,tot=0;if(nocmp)pv={note:pv.note};
hits.forEach(function(h){tot+=+h.views||0});
$('#who').textContent=(d.operator&&d.operator.name?d.operator.name+' · ':'')+(d.brand_handle||'');
$('#t').textContent='Resumen diario de X · '+(fmt(d.date+'T00:00').replace(/, 00:00$/,'')||'');
$('#upd').textContent='Actualizado: '+fmt(d.updated)+' (hora de Ciudad de México)'+(d.virals_window?' · Ventana: '+d.virals_window:'');
var dh=pv.hits_count?(hits.length-pv.hits_count):null,s='';
s+='<section class="stats"><div class="st"><b>'+n(hits.length)+'</b>posts con +5 mil vistas'+(dh!=null?'<div class="mu '+(dh>=0?'up':'')+'">'+(dh>=0?'+':'')+dh+' vs. ayer ('+n(pv.hits_count)+')</div>':nocmp?'<div class="mu">'+e(pv.note||'Sin comparación con ayer')+'</div>':'')+'</div>';
s+='<div class="st"><b>'+n(hits.filter(function(h){return h.views>=1e4}).length)+'</b>con +10 mil vistas</div>';
s+='<div class="st"><b>'+cmp(tot)+'</b>vistas sumadas'+(pv.total_views?'<div class="mu">ayer: '+cmp(pv.total_views)+'</div>':'')+'</div></section>';
if(d.narrative_synthesis)s+='<h2>Qué está funcionando</h2><p>'+e(d.narrative_synthesis)+'</p>';
if(d.virals_narrative)s+='<p class="mu">'+e(d.virals_narrative)+'</p>';
var dr=hits.filter(function(h){return h.draft_en});
if(dr.length)s+='<h2>Borradores para hoy</h2><div class="grid">'+dr.map(function(h){return card(h,1)}).join('')+'</div>';
if(d.trend_keywords&&d.trend_keywords.length)s+='<h2>Palabras clave en tendencia</h2><ul class="chips">'+d.trend_keywords.map(function(k){return'<li>'+e(k.keyword||k)+'</li>'}).join('')+'</ul>';
if(d.patterns&&d.patterns.length)s+='<h2>Tendencias</h2><ul class="l">'+d.patterns.map(function(p){return'<li>'+e(p.text||p)+'</li>'}).join('')+'</ul>';
s+='<h2>Posts que más pegaron</h2><div class="grid" id="hits"></div>';
if(hits.length>PAGE)s+='<button class="btn" id="more"></button>';
if(d.no_hits&&d.no_hits.length)s+='<h2>Cuentas sin posts destacados</h2><ul class="l">'+d.no_hits.map(function(x){return'<li><b>'+e(x.handle)+'</b>: '+e(x.reason)+'</li>'}).join('')+'</ul>';
app.innerHTML=s;
var shown=0,box=$('#hits'),more=$('#more');
function page(){box.insertAdjacentHTML('beforeend',hits.slice(shown,shown+PAGE).map(function(h){return card(h)}).join(''));shown=Math.min(hits.length,shown+PAGE);if(more){if(shown>=hits.length)more.remove();else more.textContent='Ver más ('+(hits.length-shown)+' restantes)'}}
page();if(more)more.onclick=page;
app.addEventListener('click',function(ev){var b=ev.target.closest('[data-c]');if(!b)return;var t=b.getAttribute('data-c'),done=function(ok){b.textContent=ok?'¡Copiado!':'No se pudo copiar';var l=$('#live');l.textContent=ok?'Borrador copiado al portapapeles':'No se pudo copiar. Selecciona el texto y cópialo a mano.';clearTimeout(b._t);b._t=setTimeout(function(){b.textContent='Copiar borrador'},ok?1500:2600)};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){done(true)},function(){done(fb(t))});else done(fb(t))});
function fb(t){var a=document.createElement('textarea'),ok=false;a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}
}
fetch('./data.json?ts='+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(function(x){app.innerHTML='<p>No se pudieron cargar los datos ('+e(x.message)+'). Recarga la página en un momento.</p>'});
})();
</script>
</body>
</html>
